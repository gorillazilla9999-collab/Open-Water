<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Water 3D</title>
<style>
:root{--ink:#fdf3e4;--panel:rgba(20,28,36,.55);--gold:#ffcf5a;--sea:#0a1624;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(8,14,20,.65)}}
:root[data-theme="dark"]{--panel:rgba(8,14,20,.65)}
html,body{height:100%;margin:0;background:var(--sea);overflow:hidden;font-family:Georgia,"Times New Roman",serif;color:var(--ink);touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--panel);padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.5;pointer-events:none}
#hud b{color:var(--gold);font-weight:normal;font-size:22px}
#cmp{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;background:var(--panel);border-radius:10px;padding:6px 14px;pointer-events:none;opacity:0;transition:opacity .3s;font-size:14px}
#cmp i{display:block;font-style:normal;color:var(--gold);font-size:24px;line-height:1}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(20,26,34,.5);transition:opacity .6s;padding:20px}
#intro h1{font-size:clamp(40px,9vw,84px);font-weight:normal;font-style:italic;margin:0 0 12px}
#intro p{max-width:36ch;font-size:18px;line-height:1.5;margin:6px 0}
#intro button{margin-top:18px;font:inherit;font-size:18px;padding:10px 26px;border-radius:999px;border:2px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
#intro button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#intro.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><b id="bu" hidden>0</b><span id="sp">0</span> knots · <span id="di">0</span> m sailed</div>
<div id="cmp"><i id="arr">▲</i><span id="cd">0</span> m</div>
<div id="intro">
<h1>Open Water</h1>
<p>The sea has no edge. Ride the swell across the endless sea.</p>
<p>W / ↑ sail · A D / ← → steer · Shift boost · S / Space brake · M mute music. On touch, hold the screen to sail and press left or right of center to steer.</p>
<button id="go">Set sail</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(FOG,.006);
const camera=new THREE.PerspectiveCamera(65,1,.5,2000);

const sea=new THREE.Mesh(new THREE.PlaneGeometry(720,720,240,240).rotateX(-Math.PI/2),new THREE.ShaderMaterial({
 uniforms:{t:{value:0},sun:{value:SUN},fogC:{value:new THREE.Color(FOG)},deep:{value:new THREE.Color(0x01060c)},shal:{value:new THREE.Color(0x0c3646)},sky:{value:new THREE.Color(0x1c3a5c)},lp:{value:new THREE.Vector3(0,-1e5,0)},fd:{value:.006},fl:{value:0}},

 ${calls}
 wp.y=h;vW=wp.xyz;vH=h;vG=g;gl_Position=projectionMatrix*viewMatrix*wp;}`,
 fragmentShader:`uniform float t;uniform vec3 sun,fogC,deep,shal,sky,lp;uniform float fd,fl;varying vec3 vW;varying float vH;varying vec2 vG;
 float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}void main(){vec2 g=vG+0.06*vec2(sin(vW.x*1.7+t*2.),cos(vW.z*1.9+t*2.3));
 vec3 N=normalize(vec3(-g.x,1.,-g.y));vec3 V=normalize(cameraPosition-vW);
 float dif=max(dot(N,sun),0.);float spec=pow(max(dot(reflect(-sun,N),V),0.),110.);

 vec3 c=mix(deep,shal,clamp(vH*.05+.45,0.,1.));c*=.3+.5*dif;c=mix(c,sky,fr*.5);c+=spec*vec3(.7,.82,1.)*1.6;vec3 Ld=lp-vW;float dl=length(Ld);vec3 Ln=Ld/dl;c+=vec3(1.,.55,.2)*(max(dot(N,Ln),0.)*8./(1.+dl*dl*.04)+pow(max(dot(reflect(-Ln,N),V),0.),70.)*4./(1.+dl*.04));
 float nz=vn(vW.xz*.5+vec2(t*.3,0.))*.6+vn(vW.xz*1.7-t*.5)*.4;float fm=smoothstep(.6,.82,nz+clamp((vH-3.)*.07,0.,.45));c=mix(c,vec3(.5,.6,.72),fm*.4);
 float d=length(vW-cameraPosition);float f=1.-exp(-pow(d*fd,2.));
 gl_FragColor=vec4(mix(c,fogC,f)+vec3(.35,.4,.55)*fl*(.25+.75*f),1.);}`}));
sea.frustumCulled=false;scene.add(sea);
const skyM=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,

 fragmentShader:`uniform vec3 sun;uniform float fl,cl;varying vec3 vP;void main(){vec3 d=normalize(vP);float h=max(d.y,0.);

// boat
const hs=new THREE.Shape();hs.moveTo(0,3.4);hs.quadraticCurveTo(1.4,1.6,1.2,-1.4);hs.lineTo(1.2,-2.2);hs.lineTo(-1.2,-2.2);hs.lineTo(-1.2,-1.4);hs.quadraticCurveTo(-1.4,1.6,0,3.4);

const lam=c=>new THREE.MeshLambertMaterial({color:c});
const wc=document.createElement('canvas');wc.width=wc.height=256;
{const x=wc.getContext('2d'),R=rng(7);x.fillStyle='#4a3524';x.fillRect(0,0,256,256);
 for(let r=0;r<6;r++){const y=r*43;x.fillStyle=`hsl(${24+R()*8},${22+R()*14}%,${28+R()*14}%)`;x.fillRect(0,y,256,42);
  for(let i=0;i<46;i++){x.strokeStyle=`rgba(${R()<.5?'20,12,6':'150,120,90'},${.08+R()*.15})`;x.beginPath();const gy=y+R()*42;x.moveTo(R()*256,gy);x.lineTo(R()*256,gy+R()*3-1.5);x.stroke()}
  x.fillStyle='#120b06';x.fillRect(0,y+41,256,2)}
 for(let i=0;i<30;i++){x.fillStyle='rgba(30,50,35,.18)';x.beginPath();x.arc(R()*256,R()*256,3+R()*9,0,7);x.fill()}}
const woodT=new THREE.CanvasTexture(wc);woodT.wrapS=woodT.wrapT=THREE.RepeatWrapping;
const wood=[0x9a7a5c,0x7a5d44,0xb09070,0x5e4632].map(c=>new THREE.MeshLambertMaterial({color:c,map:woodT}));
const WR=rng(42);
function plank(l,w,th,m){const g=new THREE.BoxGeometry(l,w,th),u=g.attributes.uv,o=Math.floor(WR()*6)/6;for(let i=0;i<u.count;i++){u.setX(i,u.getX(i)*l*.4);u.setY(i,u.getY(i)/6+o)}return new THREE.Mesh(g,m||wood[Math.floor(WR()*4)])}
const ol=[[1.2,2.2],[1.2,1.4]];for(let s=1;s<=8;s++){const q=s/8,p=1-q;ol.push([p*p*1.2+2*p*q*1.4,-(p*p*-1.4+2*p*q*1.6+q*q*3.4)])}
for(const sd of[1,-1])for(let r=0;r<4;r++)for(let i=0;i<ol.length-1;i++){
 if(WR()<.04)continue;
 const a=ol[i],b=ol[i+1],fl=1+r*.07,ax=a[0]*fl*sd,bx=b[0]*fl*sd,dx=bx-ax,dz=b[1]-a[1],p=plank(Math.hypot(dx,dz)+.06,.4,.08);
 p.position.set((ax+bx)/2+(WR()-.5)*.05,-.15+r*.38+(WR()-.5)*.04,(a[1]+b[1])/2+(WR()-.5)*.05);
 p.rotation.order='YXZ';p.rotation.set(sd*.17+(WR()-.5)*.06,-Math.atan2(dz,dx),(WR()-.5)*.05);inner.add(p)}
for(let r=0;r<4;r++){const p=plank(2.6,.4,.08);p.position.set((WR()-.5)*.06,-.15+r*.38,2.25);p.rotation.set((WR()-.5)*.08,(WR()-.5)*.04,0);inner.add(p)}
[1.1,1.15,1.15,1.15,1.1,1,.9,.65,.35].forEach((hw,i)=>{const p=plank(2*hw-.1,.06,.52);p.position.set((WR()-.5)*.06,-.2,2.1-i*.62);p.rotation.y=(WR()-.5)*.05;inner.add(p)});
const thw=plank(2.1,.1,.35);thw.position.set(0,.45,-1.1);thw.rotation.y=.04;inner.add(thw);
const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,1.25,1.4),wood[2]);cab.position.set(.05,.43,.5);cab.rotation.y=.03;inner.add(cab);
const cw=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.45),new THREE.MeshBasicMaterial({color:0x0b1218}));cw.position.set(.05,.65,-.21);cw.rotation.y=.03;inner.add(cw);
const roof=plank(2.1,.08,1.8,lam(0x7a4a3a));roof.position.set(0,1.1,.5);roof.rotation.set(-.03,0,.05);inner.add(roof);
const chim=new THREE.Mesh(new THREE.CylinderGeometry(.1,.12,.9,8),lam(0x2a2522));chim.position.set(.5,1.6,.9);chim.rotation.z=-.08;inner.add(chim);
const mast=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,3.6,8),wood[3]);mast.position.set(0,1.6,-1.6);mast.rotation.z=.07;inner.add(mast);

const lamp={};
const flag=new THREE.Mesh(new THREE.PlaneGeometry(.6,.35),new THREE.MeshLambertMaterial({color:0x7a2a2a,side:THREE.DoubleSide}));flag.position.set(.2,2.9,-1.6);inner.add(flag);
const mot=new THREE.Mesh(new THREE.BoxGeometry(.35,.6,.4),lam(0x1d2226));mot.position.set(0,.5,2.5);inner.add(mot);
const leg=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.9,6),lam(0x1d2226));leg.position.set(0,-.2,2.55);inner.add(leg);
for(const z of[-.3,1.1]){const ty=new THREE.Mesh(new THREE.TorusGeometry(.28,.1,8,14),lam(0x0c0c0c));ty.position.set(1.4,.45,z);ty.rotation.y=Math.PI/2;inner.add(ty)}
const bar=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.6,10),wood[1]);bar.position.set(-.6,.1,-.3);inner.add(bar);
const crt=plank(.5,.5,.5);crt.position.set(-.5,.05,1.75);crt.rotation.y=.4;inner.add(crt);
const rope=new THREE.Mesh(new THREE.TorusGeometry(.25,.07,6,14),lam(0xb8a070));rope.position.set(.5,-.1,-1.6);rope.rotation.x=Math.PI/2;inner.add(rope);



scene.add(boat);
const B={x:0,z:0,a:0,vx:0,vz:0,sp:0,rx:0,rz:0};

// wake
const WN=160,wpos=new Float32Array(WN*3),wcol=new Float32Array(WN*3),wl=new Float32Array(WN).fill(9);let wi=0,wt=0;
const wgeo=new THREE.BufferGeometry();wgeo.setAttribute('position',new THREE.BufferAttribute(wpos,3));wgeo.setAttribute('color',new THREE.BufferAttribute(wcol,3));
const cc=document.createElement('canvas');cc.width=cc.height=32;const cx2=cc.getContext('2d'),gr=cx2.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#0000');cx2.fillStyle=gr;cx2.fillRect(0,0,32,32);

// world chunks
const CH=300,active=new Map(),got=new Set(),rings=[];let score=0,dist=0,lastKey='';
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let r=Math.imul(s^s>>>15,1|s);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}
const gCyl=new THREE.CylinderGeometry(.92,1.1,44,28),gSph=new THREE.SphereGeometry(1,20,12),gCone=new THREE.ConeGeometry(1.2,4,6);
const mSand=lam(0xe5d29c),mGrn=lam(0x4e8d58),mTree=lam(0x2f6a3e);
const gBody=new THREE.CylinderGeometry(1.1,1.5,1.8,16),gBand=new THREE.CylinderGeometry(1.3,1.3,.5,16),gMast=new THREE.CylinderGeometry(.12,.12,3,6),gLamp=new THREE.SphereGeometry(.45,10,8),gBeam=new THREE.CylinderGeometry(.35,.35,70,8,1,true);
const mRed=lam(0xd93b30),mWhite=lam(0xf4efe4),mLamp=new THREE.MeshBasicMaterial({color:0xffe08a}),mBeam=new THREE.MeshBasicMaterial({color:0xffcf5a,transparent:true,opacity:.45,depthWrite:false,blending:THREE.AdditiveBlending});
function island(o){const g=new THREE.Group();g.position.set(o.x,0,o.z);
 const s=new THREE.Mesh(gCyl,mSand);s.scale.set(o.r,1,o.r);s.position.y=0;g.add(s);
 const hr=o.r*.62,hh=o.r*.28,h=new THREE.Mesh(gSph,mGrn);h.scale.set(hr,hh,hr);h.position.y=22;g.add(h);
 const R=rng(o.s);for(let i=0;i<4;i++){const a=R()*6.28,d=R()*hr*.7,tr=new THREE.Mesh(gCone,mTree);tr.position.set(Math.cos(a)*d,22+hh*Math.sqrt(1-(d/hr)**2)+1.4,Math.sin(a)*d);tr.scale.setScalar(.8+R()*.6);g.add(tr)}
 return g}
function buoy(b){const g=new THREE.Group();
 const a=new THREE.Mesh(gBody,mRed);a.position.y=.4;g.add(a);const bd=new THREE.Mesh(gBand,mWhite);bd.position.y=.7;g.add(bd);
 const m=new THREE.Mesh(gMast,mWhite);m.position.y=2.5;g.add(m);const l=new THREE.Mesh(gLamp,mLamp);l.position.y=4.1;g.add(l);
 const bm=new THREE.Mesh(gBeam,mBeam);bm.position.y=38;g.add(bm);g.position.set(b.x,0,b.z);return g}
function build(cx,cz){
 const R=rng((cx*73856093)^(cz*19349663)^0x51ed),c={g:new THREE.Group(),isl:[],bu:[],lm:[]};
 if(false){const o={x:cx*CH+35+R()*(CH-70),z:cz*CH+35+R()*(CH-70),r:14+R()*12,s:Math.floor(R()*1e6)};c.isl.push(o);c.g.add(island(o))}
 const n=0;
 for(let i=0;i<n;i++){const b={x:cx*CH+R()*CH,z:cz*CH+R()*CH,id:cx+','+cz+':'+i};
  if(got.has(b.id)||!c.isl.every(o=>Math.hypot(o.x-b.x,o.z-b.z)>o.r+14))continue;
  b.m=buoy(b);c.g.add(b.m);c.bu.push(b)}

  if(c.isl.every(o=>Math.hypot(o.x-lx,o.z-lz)>o.r+r+25)){const lm={x:lx,z:lz,r,ty,name:nm,id:'L'+cx+','+cz};c.lm.push(lm);c.isl.push({x:lx,z:lz,r});c.g.add(landmark(lm))}}
 scene.add(c.g);return c}
function sync(){
 const cx=Math.floor(B.x/CH),cz=Math.floor(B.z/CH),k=cx+','+cz;if(k===lastKey)return;lastKey=k;
 const keep=new Set();
 for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++){const kk=(cx+i)+','+(cz+j);keep.add(kk);if(!active.has(kk))active.set(kk,build(cx+i,cz+j))}
 for(const [kk,c] of active)if(!keep.has(kk)){scene.remove(c.g);active.delete(kk)}
}

// ===== weather, sea life, sound, landmarks =====
let AC,M;const aux={};let wx=0,wxT=0,wxTimer=40,fl=0,flick=0,ltTimer=8,fogD=.006,creakT=2,podT=8,whaleT=30,whale=null;
const pods=[],found=new Set(),logs=[];

  add(new THREE.CylinderGeometry(.35,.5,16,6),wood[0],-1,22,-3,.1,0,.55)}
 else if(l.ty===1){add(new THREE.BoxGeometry(5,42,6),mSt,-9,12,0);add(new THREE.BoxGeometry(5,42,6),mSt,9,12,0,0,0,.03);add(new THREE.BoxGeometry(26,5,7),mSt,0,34,0,0,0,-.02)}
 else if(l.ty===2){add(new THREE.ConeGeometry(8,60,9),mSt,0,36,0);add(new THREE.ConeGeometry(5,36,8),mSt2,6,24,3)}

// rain

for(let i=0;i<RN;i++){rp[i*3]=(Math.random()-.5)*90;rp[i*3+1]=Math.random()*60-20;rp[i*3+2]=(Math.random()-.5)*90}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(rpos,3));

function rainTick(dt,a){rain.visible=a>.02;if(!rain.visible)return;rain.material.opacity=.45*a;const cp=camera.position;
